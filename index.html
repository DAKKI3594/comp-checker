<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>♡ コンプチェッカー ♡ v2.1</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;background:#fff7fc;color:#4a3b45}
header{background:linear-gradient(135deg,#ff9dcc,#c9a7ff);color:#fff;text-align:center;padding:24px 16px;border-radius:0 0 24px 24px}
header h1{margin:0;font-size:28px}header p{margin:6px 0 0;font-size:14px}.container{max-width:700px;margin:auto;padding:16px}
.progress-box{background:#fff;border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 3px 12px rgba(0,0,0,.08);text-align:center}
.progress-text{font-size:28px;font-weight:bold}.progress-bar{height:14px;background:#eee;border-radius:20px;overflow:hidden;margin-top:10px}.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#ff8fc7,#b99aff);transition:width .3s}
.controls{display:flex;gap:8px;margin-bottom:12px}.controls button{flex:1;border:0;border-radius:12px;padding:11px 4px;background:#fff;color:#6b5965;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.08)}.controls button.active{background:#ff9dcc;color:#fff}
.search{width:100%;padding:13px 15px;border:2px solid #f0dce8;border-radius:14px;font-size:16px;margin-bottom:12px;outline:0}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#fff;border-radius:16px;padding:10px;box-shadow:0 3px 10px rgba(0,0,0,.08);cursor:pointer;position:relative}
.card-image{width:100%;aspect-ratio:3/4;border-radius:10px;background:linear-gradient(135deg,#f3d8ff,#ffd9ed);display:flex;align-items:center;justify-content:center;overflow:hidden;color:#987c91;font-size:13px;text-align:center}.card-image img{width:100%;height:100%;object-fit:contain;display:block}
.card-name{font-weight:bold;margin-top:8px;font-size:14px}.badges{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}.badge{font-size:11px;padding:3px 7px;border-radius:999px;background:#eee;color:#777}.badge.want{background:#ffd8ec;color:#d34d91}.badge.have{background:#e1d7ff;color:#7157b5}
.empty{text-align:center;padding:40px 10px;color:#999}.actions{display:flex;gap:8px;margin-top:16px}.actions button,.reset{flex:1;padding:12px;border:0;border-radius:12px;font-size:14px}
.actions button:first-child{background:#ff9dcc;color:#fff}.actions button:last-child{background:#c9a7ff;color:#fff}.reset{width:100%;margin-top:10px;background:#eee;color:#777}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.open{display:flex}
.sheet{background:#fff;border-radius:20px;padding:20px;width:min(420px,100%);box-shadow:0 10px 40px rgba(0,0,0,.25)}.sheet h2{margin:0 0 12px}
.choice{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.choice button{flex:1;min-width:30%;padding:12px;border:2px solid #eee;border-radius:12px;background:#fff}.choice button.selected{border-color:#ff9dcc;background:#fff0f7}
.qty{width:100%;padding:12px;border:2px solid #eee;border-radius:12px;font-size:18px}.sheet-actions{display:flex;gap:8px;margin-top:16px}.sheet-actions button{flex:1;padding:12px;border:0;border-radius:12px}.save{background:#ff9dcc;color:#fff}.cancel{background:#eee}

.card{padding:10px}
.card-open{display:block;width:100%;padding:0;border:0;background:transparent;text-align:left;color:inherit;cursor:pointer}
.card-open:active .card-image{transform:scale(.98)}
.card-image{transition:transform .12s}
.status-button{width:100%;margin-top:9px;padding:10px 6px;border:2px solid #eee;border-radius:12px;background:#f7f7f7;color:#777;font-size:13px;font-weight:600;cursor:pointer}
.status-button.want{border-color:#ffb6d8;background:#fff0f7;color:#d34d91}
.status-button.have{border-color:#c9b8ff;background:#f4f0ff;color:#7157b5}
.status-button.none{border-color:#e5e5e5;background:#f7f7f7;color:#777}
.modal.open{overflow:auto}
.list-preview{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;overflow:auto;padding:20px 12px}.preview-sheet{max-width:700px;margin:20px auto;background:#fff;border-radius:18px;padding:14px}.preview-head{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:18px}.preview-head button{border:0;background:#eee;border-radius:10px;padding:8px 12px}.preview-note{font-size:13px;color:#777;margin:10px 0}.preview-body{text-align:center}.loading{padding:40px;color:#777}.generated-list-image{width:100%;height:auto;display:block;border-radius:10px;-webkit-touch-callout:default;user-select:none}</style>
</head>
<body>
<header><h1>♡ コンプチェッカー ♡</h1><p>アイカツ！アンコール 第1弾</p></header>
<div class="container">
<div class="progress-box"><div>コンプリート率</div><div class="progress-text" id="percent">0%</div><div class="progress-bar"><div class="progress-fill" id="progress"></div></div><div id="count">0 / 85 枚</div></div>
<input class="search" id="search" type="text" placeholder="🔍 カード番号を検索">
<div class="controls"><button class="active" onclick="setFilter('all',this)">すべて</button><button onclick="setFilter('have',this)">所持数</button><button onclick="setFilter('want',this)">欲しいもの</button></div>
<div class="cards" id="cards"></div>
<div class="actions"><button onclick="makeList('want')">欲しいものリストを画像化</button><button onclick="makeList('have')">所持カードリストを画像化</button></div>
<button class="reset" onclick="resetData()">データをリセット</button>
</div>
<div class="modal" id="modal"><div class="sheet"><h2 id="modalTitle">カード</h2>
<div style="font-size:13px;color:#777;margin-bottom:6px">このカードの状態を選んでください</div><div class="choice"><button id="noneBtn" onclick="chooseType('none')">未設定</button><button id="wantBtn" onclick="chooseType('want')">♡ 欲しいもの</button><button id="haveBtn" onclick="chooseType('have')">📦 所持数</button></div>
<input class="qty" id="qty" type="number" min="0" max="99" value="1" placeholder="所持数">
<div class="sheet-actions"><button class="cancel" onclick="closeModal()">キャンセル</button><button class="save" onclick="saveCard()">保存</button></div>
</div></div>
<script>
const cards=[
  {id:"E1-01",image:""},
  {id:"E1-02",image:""},
  {id:"E1-03",image:""},
  {id:"E1-04",image:""},
  {id:"E1-05",image:"E1-05.webp"},
  {id:"E1-06",image:"E1-06.webp"},
  {id:"E1-07",image:"E1-07.webp"},
  {id:"E1-08",image:"E1-08.webp"},
  {id:"E1-09",image:"E1-09.webp"},
  {id:"E1-10",image:"E1-10.webp"},
  {id:"E1-11",image:"E1-11.webp"},
  {id:"E1-12",image:"E1-12.webp"},
  {id:"E1-13",image:"E1-13.webp"},
  {id:"E1-14",image:"E1-14.webp"},
  {id:"E1-15",image:"E1-15.webp"},
  {id:"E1-16",image:"E1-16.webp"},
  {id:"E1-17",image:"E1-17.webp"},
  {id:"E1-18",image:"E1-18.webp"},
  {id:"E1-19",image:"E1-19.webp"},
  {id:"E1-20",image:"E1-20.webp"},
  {id:"E1-21",image:"E1-21.webp"},
  {id:"E1-22",image:"E1-22.webp"},
  {id:"E1-23",image:"E1-23.webp"},
  {id:"E1-24",image:"E1-24.webp"},
  {id:"E1-25",image:"E1-25.webp"},
  {id:"E1-26",image:"E1-26.webp"},
  {id:"E1-27",image:"E1-27.webp"},
  {id:"E1-28",image:"E1-28.webp"},
  {id:"E1-29",image:"E1-29.webp"},
  {id:"E1-30",image:""},
  {id:"E1-31",image:""},
  {id:"E1-32",image:""},
  {id:"E1-33",image:""},
  {id:"E1-34",image:""},
  {id:"E1-35",image:""},
  {id:"E1-36",image:""},
  {id:"E1-37",image:"E1-37.webp"},
  {id:"E1-38",image:"E1-38.webp"},
  {id:"E1-39",image:"E1-39.webp"},
  {id:"E1-40",image:"E1-40.webp"},
  {id:"E1-41",image:"E1-41.webp"},
  {id:"E1-42",image:"E1-42.webp"},
  {id:"E1-43",image:"E1-43.webp"},
  {id:"E1-44",image:"E1-44.webp"},
  {id:"E1-45",image:"E1-45.webp"},
  {id:"E1-46",image:"E1-46.webp"},
  {id:"E1-47",image:"E1-47.webp"},
  {id:"E1-48",image:"E1-48.webp"},
  {id:"E1-49",image:"E1-49.webp"},
  {id:"E1-50",image:""},
  {id:"E1-51",image:"E1-51.webp"},
  {id:"E1-52",image:"E1-52.webp"},
  {id:"E1-53",image:"E1-53.webp"},
  {id:"E1-54",image:"E1-54.webp"},
  {id:"E1-55",image:"E1-55.webp"},
  {id:"E1-56",image:"E1-56.webp"},
  {id:"E1-57",image:"E1-57.webp"},
  {id:"E1-58",image:"E1-58.webp"},

  {id:"E1-60",image:"E1-60.webp"},
  {id:"E1-61",image:"E1-61.webp"},
  {id:"E1-62",image:"E1-62.webp"},
  {id:"E1-63",image:"E1-63.webp"},
  {id:"E1-64",image:"E1-64.webp"},
  {id:"E1-65",image:"E1-65.webp"},
  {id:"E1-66",image:"E1-66.webp"},
  {id:"E1-67",image:"E1-67.webp"},
  {id:"E1-68",image:"E1-68.webp"},
  {id:"E1-69",image:"E1-69.webp"},
  {id:"E1-70",image:"E1-70.webp"},
  {id:"E1-71",image:""},
  {id:"E1-72",image:""},
  {id:"E1-73",image:""},
  {id:"E1-74",image:""},
  {id:"E1-75",image:""},
  {id:"E1-76",image:""},
  {id:"E1-77",image:""},
  {id:"E1-78",image:""},
  {id:"E1-79",image:""},
  {id:"E1-80",image:""},
  {id:"E1-81",image:""},
  {id:"E1-82",image:""},
  {id:"E1-83",image:"E1-83.webp"},
  {id:"E1-84",image:"E1-84.webp"},
  {id:"E1-85",image:"E1-85.webp"}
];
let data=JSON.parse(localStorage.getItem("aikatsu-encore-e1-data-v2")||"{}");
const oldOwned=JSON.parse(localStorage.getItem("aikatsu-encore-e1-owned")||"[]");
if(Object.keys(data).length===0 && Array.isArray(oldOwned) && oldOwned.length){
 oldOwned.forEach(id=>data[id]={type:"have",qty:1});
 localStorage.setItem("aikatsu-encore-e1-data-v2",JSON.stringify(data));
}
let filter="all",editingId="",editingType="none";
function saveData(){localStorage.setItem("aikatsu-encore-e1-data-v2",JSON.stringify(data));}
function state(c){return data[c.id]||{type:"none",qty:0}}
function render(){
 const s=document.getElementById("search").value.toLowerCase(),area=document.getElementById("cards");
 const filtered=cards.filter(c=>{const d=state(c);return c.id.toLowerCase().includes(s)&&(filter==="all"||(filter==="want"&&d.type==="want")||(filter==="have"&&d.type==="have"&&d.qty>0));});
 area.innerHTML=filtered.length?filtered.map(c=>{
 const d=state(c);
 const label=d.type==="want"?"♡ 欲しいもの":d.type==="have"&&d.qty>0?`📦 所持数 ${d.qty}枚`:"未設定";
 const cls=d.type==="want"?"want":d.type==="have"&&d.qty>0?"have":"none";
 return `<div class="card">
   <button class="card-open" type="button" onclick="openModal('${c.id}')">
     <div class="card-image">${c.image?`<img src="${c.image}" alt="${c.id}">`:"<div>画像準備中<br>（ダミーカード）</div>"}</div>
     <div class="card-name">${c.id}</div>
   </button>
   <button class="status-button ${cls}" type="button" onclick="openModal('${c.id}')">${label}</button>
 </div>`;
}).join(""):'<div class="empty">該当するカードがありません</div>';
 updateProgress();
}
function updateProgress(){const have=cards.filter(c=>state(c).type==="have"&&state(c).qty>0).length,p=Math.round(have/cards.length*100);document.getElementById("percent").textContent=p+"%";document.getElementById("progress").style.width=p+"%";document.getElementById("count").textContent=have+" / "+cards.length+" 枚";}
function setFilter(t,b){filter=t;document.querySelectorAll(".controls button").forEach(x=>x.classList.remove("active"));b.classList.add("active");render();}
function openModal(id){editingId=id;const d=state(cards.find(c=>c.id===id));editingType=d.type||"none";document.getElementById("modalTitle").textContent=id;document.getElementById("qty").value=d.qty||1;updateChoice();document.getElementById("modal").classList.add("open");}
function chooseType(t){editingType=t;updateChoice();}
function updateChoice(){
 ["none","want","have"].forEach(t=>document.getElementById(t+"Btn").classList.toggle("selected",editingType===t));
 const q=document.getElementById("qty");
 q.style.display=editingType==="have"?"block":"none";
 q.disabled=editingType!=="have";
}
function saveCard(){const qty=Math.max(0,Math.min(99,Number(document.getElementById("qty").value)||0));data[editingId]=editingType==="have"?{type:"have",qty}:{type:editingType,qty:0};saveData();closeModal();render();}
function closeModal(){document.getElementById("modal").classList.remove("open");editingId="";editingType="none";}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal();});
function resetData(){if(confirm("欲しいもの・所持数をすべてリセットしますか？")){data={};saveData();render();}}
function makeList(type){
 const selected=cards.filter(c=>state(c).type===type&&((type==="have"&&state(c).qty>0)||type==="want"));
 if(!selected.length){alert(type==="want"?"欲しいものが選択されていません":"所持カードが登録されていません");return;}
 const old=document.getElementById("listPreview"); if(old) old.remove();
 const wrap=document.createElement("div"); wrap.id="listPreview"; wrap.className="list-preview";
 wrap.innerHTML='<div class="preview-sheet"><div class="preview-head"><strong>'+(type==="want"?"♡ 欲しいものリスト":"📦 所持カードリスト")+'</strong><button type="button" onclick="document.getElementById(\'listPreview\').remove()">閉じる</button></div><div class="preview-note">横8枚 × 縦5枚（1画像40枚）／数字はカードの下に表示されます。画像を長押しして「写真に保存」できます</div><div id="previewBody" class="preview-body"><div class="loading">画像を作成中…</div></div></div>';
 document.body.appendChild(wrap);
 const body=document.getElementById("previewBody");
 const cols=8,rows=5,perPage=cols*rows,cellW=300,cellH=560,marginX=18,top=90;
 const pages=[];
 for(let page=0;page<Math.ceil(selected.length/perPage);page++){
   const pageItems=selected.slice(page*perPage,(page+1)*perPage);
   const canvas=document.createElement("canvas"),ctx=canvas.getContext("2d");
   canvas.width=cols*cellW+marginX*2;canvas.height=rows*cellH+top+30;
   ctx.fillStyle="#ffffff";ctx.fillRect(0,0,canvas.width,canvas.height);
   ctx.fillStyle="#24305f";ctx.font="bold 30px sans-serif";ctx.textAlign="center";
   ctx.fillText(type==="want"?"♡ 欲しいものリスト":"📦 所持カードリスト",canvas.width/2,42);
   ctx.fillStyle="#777";ctx.font="16px sans-serif";
   ctx.fillText((page+1)+" / "+Math.ceil(selected.length/perPage),canvas.width/2,68);
   pages.push({canvas,ctx,pageItems});
 }
 const images=[];
 let remaining=selected.length;
 const addResult=()=>{
   remaining--;
   if(remaining>0)return;
   body.innerHTML="";
   pages.forEach((p,pi)=>{
     const block=document.createElement("div");block.className="generated-page";
     const img=document.createElement("img");img.className="generated-list-image";img.alt="作成したリスト画像 "+(pi+1);
     img.src=p.canvas.toDataURL("image/png");
     block.appendChild(img);body.appendChild(block);
   });
 };
 pages.forEach((p)=>{
   p.pageItems.forEach((c,i)=>{
     const d=state(c),x=marginX+(i%cols)*cellW,y=top+Math.floor(i/cols)*cellH;
     ctx=p.ctx;
     ctx.fillStyle="#fff";ctx.fillRect(x+8,y+8,cellW-16,cellH-16);
     ctx.strokeStyle="#27324d";ctx.lineWidth=3;ctx.strokeRect(x+8,y+8,cellW-16,cellH-16);
     const drawPlaceholder=()=>{
       ctx.fillStyle="#f3d8ff";ctx.fillRect(x+40,y+28,cellW-80,330);
       ctx.fillStyle="#987c91";ctx.font="16px sans-serif";ctx.textAlign="center";ctx.fillText("画像準備中",x+cellW/2,y+200);
       drawText();
     };
     const drawText=()=>{
       ctx.textAlign="center";
       ctx.fillStyle="#222";ctx.font="bold 16px sans-serif";ctx.fillText(c.id,x+cellW/2,y+385);
       ctx.fillStyle=type==="have"?"#1638c9":"#1638c9";
       ctx.font='bold 48px "Comic Sans MS","Hiragino Maru Gothic ProN",sans-serif';
       ctx.fillText(type==="have"?String(d.qty):"♡",x+cellW/2,y+445);
     };
     if(c.image){
       const img=new Image();
       img.onload=()=>{ctx.drawImage(img,x+40,y+28,cellW-80,330);drawText();addResult();};
       img.onerror=()=>{drawPlaceholder();addResult();};
       img.src=c.image;
     }else{drawPlaceholder();addResult();}
   });
 });
}
document.getElementById("search").addEventListener("input",render);render();
</script>
</body></html>
