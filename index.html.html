<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>コンプチェッカー</title><style>*{box-sizing:border-box}
:root{--pink:#f48fca;--pink2:#ffd8ee;--purple:#bda8f7;--lav:#f1e5ff;--ink:#5d4658;--muted:#9c8396;--gold:#f3c66b}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;background:linear-gradient(180deg,#fff7fc 0%,#f8efff 100%);color:var(--ink);min-height:100vh}
body:before{content:"✦  ♡  ✧  ♡  ✦  ✧";position:fixed;top:90px;left:0;right:0;text-align:center;color:rgba(255,255,255,.7);font-size:22px;letter-spacing:18px;pointer-events:none;z-index:0}
header{position:relative;overflow:hidden;text-align:center;color:#fff;padding:30px 16px 26px;background:linear-gradient(135deg,#ff9bd0 0%,#f6b4dc 38%,#c5a9fa 100%);border-radius:0 0 34px 34px;box-shadow:0 8px 24px rgba(188,126,177,.2)}
header:before,header:after{content:"";position:absolute;width:90px;height:90px;border:2px solid rgba(255,255,255,.45);border-radius:50%;top:-35px}header:before{left:-28px}header:after{right:-28px}
.logo-badge{display:inline-flex;align-items:center;justify-content:center;width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.28);border:2px solid rgba(255,255,255,.75);box-shadow:0 0 0 6px rgba(255,255,255,.1),0 6px 16px rgba(150,80,140,.18);font-size:28px;margin-bottom:8px}
header h1{margin:0;font-size:29px;letter-spacing:1px;text-shadow:0 2px 8px rgba(133,70,120,.2)}
header p{margin:7px 0 0;font-size:14px;font-weight:600;letter-spacing:1px}
.container{position:relative;z-index:1;max-width:700px;margin:auto;padding:16px}
.progress-box{background:rgba(255,255,255,.94);border:2px solid #f5d5ea;border-radius:24px;padding:18px;margin-bottom:15px;box-shadow:0 8px 22px rgba(181,131,175,.13);text-align:center;position:relative;overflow:hidden}
.progress-box:before{content:"✦";position:absolute;left:16px;top:12px;color:#f6bfdc;font-size:18px}.progress-box:after{content:"✧";position:absolute;right:17px;top:12px;color:#c6b1f2;font-size:20px}
.progress-title{font-size:13px;font-weight:700;letter-spacing:1px;color:#8d7084}.progress-text{font-size:34px;font-weight:800;color:#e57ab7;margin-top:2px;text-shadow:0 2px 0 #fff}.progress-bar{height:15px;background:#f3e9f3;border-radius:20px;overflow:hidden;margin-top:9px;border:1px solid #ead9e8}.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#ff8fc7,#c4a4f7);transition:width .3s;box-shadow:0 0 10px rgba(244,143,202,.35)}#count{margin-top:7px;font-size:13px;color:#8f788b;font-weight:600}
.search{width:100%;padding:14px 16px;border:2px solid #efd9ea;border-radius:18px;font-size:16px;margin-bottom:12px;outline:0;background:rgba(255,255,255,.95);color:var(--ink);box-shadow:0 5px 14px rgba(180,130,174,.09)}.search:focus{border-color:#e9a5ce;box-shadow:0 0 0 4px rgba(244,143,202,.12)}
.controls{display:flex;gap:8px;margin-bottom:16px}.controls button{flex:1;border:2px solid #efddea;border-radius:16px;padding:11px 4px;background:rgba(255,255,255,.9);color:#816c7c;font-size:14px;font-weight:700;box-shadow:0 4px 10px rgba(180,130,174,.08)}.controls button.active{border-color:#f39dcb;background:linear-gradient(135deg,#f6a1cf,#d2b4fa);color:#fff;box-shadow:0 5px 13px rgba(224,132,190,.2)}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.card{background:rgba(255,255,255,.97);border:2px solid #f3e1ed;border-radius:21px;padding:9px;box-shadow:0 7px 17px rgba(174,128,170,.12);cursor:pointer;position:relative;transition:transform .15s,box-shadow .15s,border-color .15s}.card:active{transform:scale(.97)}.card.owned{border-color:#f4a3cd;box-shadow:0 8px 20px rgba(235,126,184,.2);outline:0}.card-image{width:100%;aspect-ratio:3/4;border-radius:14px;background:linear-gradient(135deg,#f3dcff,#ffe0ef);display:flex;align-items:center;justify-content:center;overflow:hidden;color:#9a7f93;font-size:13px;text-align:center}.card-image img{width:100%;height:100%;object-fit:contain;display:block}.dummy-label{padding:10px}.card-name{font-weight:800;margin-top:9px;font-size:15px;color:#5e4858}.card-number{font-size:12px;color:#a38c9e;margin-top:2px}.dummy-note{font-size:11px;color:#c0aeba;margin-top:3px;font-weight:600}.check{position:absolute;top:15px;right:15px;width:32px;height:32px;border-radius:50%;background:#bdb7bf;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;z-index:2;border:2px solid #fff;box-shadow:0 3px 8px rgba(90,60,80,.14)}.card.owned .check{background:linear-gradient(135deg,#ff76b8,#c99df5);box-shadow:0 3px 10px rgba(222,107,178,.3)}
.empty{text-align:center;padding:45px 10px;color:#9e8999}.reset{width:100%;margin-top:22px;padding:12px;border:2px solid #eadde8;border-radius:16px;background:rgba(255,255,255,.7);color:#9a8795;font-weight:600}
@media(max-width:380px){header h1{font-size:25px}.cards{gap:9px}.card{padding:7px}.card-name{font-size:14px}}

/* 欲しいもの・所持数 */

.count-box{display:flex;align-items:center;border:1px solid #d8c7df;border-radius:14px;overflow:hidden;background:#fff}

.count-label{font-size:11px;font-weight:700}
.list-tools{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.list-tools button{border:0;border-radius:18px;padding:9px 12px;font-weight:700;background:#fff;box-shadow:0 2px 8px rgba(120,80,150,.12)}

</style></head><body><header><div class="logo-badge">♡</div><h1>♡ コンプチェッカー ♡</h1><p>アイカツ！アンコール 第1弾</p></header><div class="container"><div class="progress-box"><div class="progress-title">✦ MY COLLECTION ✦</div><div class="progress-text" id="percent">0%</div><div class="progress-bar"><div class="progress-fill" id="progress"></div></div><div id="count">0 / 85 枚</div></div><input class="search" id="search" type="text" placeholder="🔍 カード番号を検索"><div class="controls"><button class="active" onclick="setFilter('all',this)">すべて</button><button onclick="setFilter('owned',this)">所持</button><button onclick="setFilter('missing',this)">未所持</button></div><div class="cards" id="cards"></div><button class="reset" onclick="resetData()">所持データをリセット</button></div><script>const cards=[{"id":"E1-01","name":"E1-01","image":"","dummy":true},{"id":"E1-02","name":"E1-02","image":"","dummy":true},{"id":"E1-03","name":"E1-03","image":"","dummy":true},{"id":"E1-04","name":"E1-04","image":"","dummy":true},{"id":"E1-05","name":"E1-05","image":"cards/E1-05.webp","dummy":false},{"id":"E1-06","name":"E1-06","image":"cards/E1-06.webp","dummy":false},{"id":"E1-07","name":"E1-07","image":"cards/E1-07.webp","dummy":false},{"id":"E1-08","name":"E1-08","image":"cards/E1-08.webp","dummy":false},{"id":"E1-09","name":"E1-09","image":"cards/E1-09.webp","dummy":false},{"id":"E1-10","name":"E1-10","image":"cards/E1-10.webp","dummy":false},{"id":"E1-11","name":"E1-11","image":"cards/E1-11.webp","dummy":false},{"id":"E1-12","name":"E1-12","image":"cards/E1-12.webp","dummy":false},{"id":"E1-13","name":"E1-13","image":"cards/E1-13.webp","dummy":false},{"id":"E1-14","name":"E1-14","image":"cards/E1-14.webp","dummy":false},{"id":"E1-15","name":"E1-15","image":"cards/E1-15.webp","dummy":false},{"id":"E1-16","name":"E1-16","image":"cards/E1-16.webp","dummy":false},{"id":"E1-17","name":"E1-17","image":"cards/E1-17.webp","dummy":false},{"id":"E1-18","name":"E1-18","image":"cards/E1-18.webp","dummy":false},{"id":"E1-19"," ":"E1-49","name":"E1-49","image":"cards/E1-49.webp","dummy":false},{"id":"E1-50","name":"E1-50","image":"","dummy":true},{"id":"E1-51","name":"E1-51","image":"cards/E1-51.webp","dummy":false},{"id":"E1-52","name":"E1-52","image":"cards/E1-52.webp","dummy":false},{"id":"E1-53","name":"E1-53","image":"cards/E1-53.webp","dummy":false},{"id":"E1-54","name":"E1-54","image":"cards/E1-54.webp","dummy":false},{"id":"E1-55","name":"E1-55","image":"cards/E1-55.webp","dummy":false},{"id":"E1-56","name":"E1-56","image":"cards/E1-56.webp","dummy":false},{"id":"E1-57","name":"E1-57","image":"cards/E1-57.webp","dummy":false},{"id":"E1-58","name":"E1-58","image":"cards/E1-58.webp","dummy":false},{"id":"E1-59","name":"E1-59","image":"cards/E1-59.webp","dummy":false},{"id":"E1-60","name":"E1-60","image":"cards/E1-60.webp","dummy":false},{"id":"E1-61","name":"E1-61","image":"cards/E1-61.webp","dummy":false},{"id":"E1-62","name":"E1-62","image":"cards/E1-62.webp","dummy":false},{"id":"E1-63","name":"E1-63","image":"cards/E1-63.webp","dummy":false},{"id":"E1-64","name":"E1-64","image":"cards/E1-64.webp","dummy":false},{"id":"E1-65","name":"E1-65","image":"cards/E1-65.webp","dummy":false},{"id":"E1-66","name":"E1-66","image":"cards/E1-66.webp","dummy":false},{"id":"E1-67","name":"E1-67","image":"cards/E1-67.webp","dummy":false},{"id":"E1-68","name":"E1-68","image":"cards/E1-68.webp","dummy":false},{"id":"E1-69","name":"E1-69","image":"cards/E1-69.webp","dummy":false},{"id":"E1-70","name":"E1-70","image":"cards/E1-70.webp","dummy":false},{"id":"E1-71","name":"E1-71","image":"","dummy":true},{"id":"E1-72","name":"E1-72","image":"","dummy":true},{"id":"E1-73","name":"E1-73","image":"","dummy":true},{"id":"E1-74","name":"E1-74","image":"","dummy":true},{"id":"E1-75","name":"E1-75","image":"","dummy":true},{"id":"E1-76","name":"E1-76","image":"","dummy":true},{"id":"E1-77","name":"E1-77","image":"","dummy":true},{"id":"E1-78","name":"E1-78","image":"","dummy":true},{"id":"E1-79","name":"E1-79","image":"","dummy":true},{"id":"E1-80","name":"E1-80","image":"","dummy":true},{"id":"E1-81","name":"E1-81","image":"","dummy":true},{"id":"E1-82","name":"E1-82","image":"","dummy":true},{"id":"E1-83","name":"E1-83","image":"cards/E1-83.webp","dummy":false},{"id":"E1-84","name":"E1-84","image":"cards/E1-84.webp","dummy":false},{"id":"E1-85","name":"E1-85","image":"cards/E1-85.webp","dummy":false}];let owned=JSON.parse(localStorage.getItem("aikatsu-encore-e1-owned")||"[]");let filter="all";function render(){const s=document.getElementById("search").value.toLowerCase();const area=document.getElementById("cards");const filtered=cards.filter(c=>(c.id.toLowerCase().includes(s)||c.name.toLowerCase().includes(s))&&(filter==="all"||(filter==="owned"&&owned.includes(c.id))||(filter==="missing"&&!owned.includes(c.id))));if(!filtered.length){area.innerHTML='<div class="empty">該当するカードがありません</div>'}else{area.innerHTML=filtered.map(c=>{const o=owned.includes(c.id);return `<div class="card ${o?'owned':''}" onclick="toggleCard('${c.id}')"><div class="check">${o?'✓':''}</div><div class="card-image">${c.image?`<img src="${c.image}" alt="${c.id}">`:'<div class="dummy-label">画像準備中<br>（ダミーカード）</div>'}</div><div class="card-name">${c.name}</div><div class="card-number">${c.id}</div>${c.dummy?'<div class="dummy-note">追加予定</div>':''}</div>`}).join("")}updateProgress()}function toggleCard(id){owned=owned.includes(id)?owned.filter(x=>x!==id):[...owned,id];localStorage.setItem("aikatsu-encore-e1-owned",JSON.stringify(owned));render()}function updateProgress(){const total=cards.length,count=owned.length,p=Math.round(count/total*100);document.getElementById("percent").textContent=p+"%";document.getElementById("progress").style.width=p+"%";document.getElementById("count").textContent=count+" / "+total+" 枚"}function setFilter(t,b){filter=t;document.querySelectorAll(".controls button").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()}function resetData(){if(!confirm("所持データをすべてリセットしますか？"))return;owned=[];localStorage.removeItem("aikatsu-encore-e1-owned");render()}document.getElementById("search").addEventListener("input",render);render();
// ===== 欲しいもの・所持数 =====
const WISH_KEY = 'aikatsu-encore-e1-wish';
const COUNT_KEY = 'aikatsu-encore-e1-count';
let wishData = JSON.parse(localStorage.getItem(WISH_KEY) || '{}');
let countData = JSON.parse(localStorage.getItem(COUNT_KEY) || '{}');

function saveTradeSettings(){
  localStorage.setItem(WISH_KEY, JSON.stringify(wishData));
  localStorage.setItem(COUNT_KEY, JSON.stringify(countData));
}

function toggleWant(id, ev){
  if(ev) ev.stopPropagation();
  wishData[id] = !wishData[id];
  saveTradeSettings();
  render();
}

function changeCount(id, delta, ev){
  if(ev) ev.stopPropagation();
  countData[id] = Math.max(0, Number(countData[id] || 0) + delta);
  saveTradeSettings();
  render();
}

function saveListImage(type){
  const list = cards.filter(c => c.image && (type === 'want' ? wishData[c.id] : Number(countData[c.id] || 0) > 0));
  if(!list.length){
    alert(type === 'want' ? '「欲しいもの」を選択してください。' : '所持数を1以上にしてください。');
    return;
  }
  const title = type === 'want' ? '💗 欲しいものリスト' : '📦 所持リスト';
  const cols = 3, cardW = 260, cardH = 365, pad = 35, head = 95;
  const rows = Math.ceil(list.length / cols);
  const canvas = document.createElement('canvas');
  canvas.width = pad*2 + cols*cardW;
  canvas.height = head + pad*2 + rows*cardH;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle='#fff8fd'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#6f4b73'; ctx.textAlign='center';
  ctx.font='bold 32px sans-serif'; ctx.fillText('アイカツ！アンコール 第1弾',canvas.width/2,40);
  ctx.font='bold 27px sans-serif'; ctx.fillText(title,canvas.width/2,78);
  let done=0;
  list.forEach((c,i)=>{
    const img=new Image();
    img.onload=()=>{
      const x=pad+(i%cols)*cardW, y=head+pad+Math.floor(i/cols)*cardH;
      const ratio=Math.min((cardW-20)/img.width,(cardH-60)/img.height);
      const w=img.width*ratio,h=img.height*ratio;
      ctx.drawImage(img,x+(cardW-w)/2,y,w,h);
      ctx.fillStyle='#6f4b73'; ctx.font='bold 21px sans-serif';
      ctx.fillText(c.id+(type==='owned'?' ×'+Number(countData[c.id]||0):''),x+cardW/2,y+cardH-14);
      done++;
      if(done===list.length){
        const a=document.createElement('a');
        a.download=type==='want'?'aikatsu-yokumono.png':'aikatsu-shoyusu.png';
        a.href=canvas.toDataURL('image/png'); a.click();
      }
    };
    img.onerror=()=>{done++;};
    img.src=c.image;
  });
}

</script>
<script>
const listStateObserver = new MutationObserver(() => {
  document.querySelectorAll('.want-btn').forEach(btn => {
    const m=(btn.getAttribute('onclick')||'').match(/toggleWant\('([^']+)'/);
    if(m){
      const id=m[1];
      btn.classList.toggle('active', !!wishData[id]);
    }
  });
  document.querySelectorAll('[id^="count-"]').forEach(el => {
    const id=el.id.slice(6);
    el.textContent=Number(countData[id]||0);
  });
});
listStateObserver.observe(document.body,{childList:true,subtree:true});
</script>
